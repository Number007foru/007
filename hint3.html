<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำใบ้เพิ่มเติมของเมอซี่ 🧸</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            /* เปลี่ยนโทนสีพื้นหลังเป็นชมพู-ฟ้าพาสเทลน่ารัก ๆ */
            background: linear-gradient(135deg, #ffcbf2 0%, #e3f2fd 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px 5px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
            max-width: 95%;
            width: 800px;
            border: 4px dashed #ffb3c6; /* เพิ่มขอบเส้นประน่ารัก ๆ */
        }

        h1 {
            color: #ff758f;
            margin-bottom: 5px;
            font-size: 2.5rem;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .subtitle {
            color: #6c757d;
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        /* จัดวางกล่องใส่รูปภาพ 3 รูปให้เรียงกัน */
        .gallery-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap; /* รองรับการแสดงผลบนมือถือ ถ้าจอแคบจะพับลงมา */
            padding: 0 20px;
            margin-bottom: 35px;
        }

        .hint-box {
            flex: 1;
            min-width: 220px;
            background: #fff5f6;
            border: 2px solid #ffe5ec;
            border-radius: 15px;
            padding: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            transition: transform 0.2s ease;
        }

        .hint-box:hover {
            transform: translateY(-5px); /* เวลาเมาส์ชี้จะลอยขึ้นนิด ๆ */
        }

        .hint-box img {
            width: 100%;
            height: 180px;
            object-fit: cover; /* ตัดรูปแบบสัดส่วนพอดีกล่อง */
            border-radius: 10px;
            background-color: #ddd;
        }

        .hint-box p {
            color: #ff85a1;
            font-weight: bold;
            margin: 10px 0 0 0;
            font-size: 1.1rem;
        }

        /* กล่องข้อความแจ้งเตือนวันเสาร์เย็น */
        .notice-card {
            background-color: #fff0f3;
            border: 2px solid #ffb3c6;
            padding: 20px 30px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 10px;
            animation: bounce 2s infinite; /* ใส่แอนิเมชันดึ๋ง ๆ */
        }

        .notice-card h2 {
            color: #c9184a;
            margin: 0 0 5px 0;
            font-size: 1.6rem;
        }

        .notice-card p {
            color: #590d22;
            margin: 0;
            font-size: 1.1rem;
        }

        /* แอนิเมชันขยับขึ้นลงน่ารัก ๆ */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>คำใบ้ หาพี่เจอแน่เลยง่าาาา! 🧸✨</h1>
        <p class="subtitle">วิเคราะห์วนไปนะน้องงง ถ้าแค้นก็หาพี่ให้เจอละ อยากโดนทาแป้งเว้ยยยย</p>

        <div class="gallery-container">
            
            <div class="hint-box">
                <img src="1.png" alt="คำใบ้ที่ 1">
                <p>🔍 ผู้หญิง        ไม่ใช่พี่</p>
            </div>

            <div class="hint-box">
                <img src="2.jpg" alt="คำใบ้ที่ 2">
                <p>🔍 ;jkc]h;9hv'.shgvwvcx].sh Vjkqqq</p>
            </div>

            <div class="hint-box">
                <img src="3.jpg" alt="คำใบ้ที่ 3">
                <p>🔍 รหัสนักศึกษา ไม่ใช่ 6901 และ 6811</p>
            </div>

        </div>

        <div class="notice-card">
            <h2>⏳ โปรดติดตามตอนต่อไป...</h2>
            <p>คำใบ้เพิ่มเติมจะมาใน <b>วันเสาร์เย็น</b> นี้นะจ๊ะ!</p>
        </div>
    </div>

</body>
</html>
