<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mercy Q&A Board 🧸✨</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #ffcbf2 0%, #e3f2fd 100%);
            padding: 40px 0; /* เพิ่ม padding บน-ล่าง เพื่อให้รองรับหน้าจอแนวตั้งเวลากล่องยาวขึ้น */
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px 30px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4);
            max-width: 90%;
            width: 500px;
            border: 4px dashed #ffb3c6;
        }

        .avatar-zone {
            font-size: 3.5rem;
            margin-bottom: 10px;
            animation: float 3s ease-in-out infinite;
        }

        h1 {
            color: #ff758f;
            margin: 0 0 5px 0;
            font-size: 2.2rem;
        }

        .subtitle {
            color: #6c757d;
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        /* กล่องแสดงคำถามคำตอบ */
        .qa-box {
            text-align: left;
            background: #fff5f6;
            border: 2px solid #ffe5ec;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px; /* ปรับลดลงนิดหน่อยเพื่อให้วางเรียงกันสามกล่องได้สวยพอดี */
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.02);
        }

        .question {
            color: #c9184a;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 8px;
        }

        .answer {
            color: #590d22;
            background: white;
            padding: 15px;
            border-radius: 12px;
            border-left: 5px solid #ff758f;
            font-size: 1.1rem;
            line-height: 1.5;
            display: flex;
            align-items: flex-start;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
        }

        /* ปุ่มไปต่อ */
        .btn-next {
            width: 100%;
            background: #ff758f;
            color: white;
            border: none;
            padding: 15px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 143, 0.4);
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-top: 15px;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 20px rgba(255, 117, 143, 0.6);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="avatar-zone">💬✨</div>
        <h1>Mercy's Q&A Board</h1>
        <p class="subtitle">ตอบคำถามจากน้องเมอซี่สุดเอ็กซ์คลูซีฟ</p>

        <!-- กล่อง QA ช่องที่ 1 (เดิม) -->
        <div class="qa-box">
            <div class="question">
                <span>❓</span>
                <div><b>Q:</b> <br>พี่เป็นใคร</div>
            </div>
            <div class="answer">
                <span>💡</span>
                <div><b>A:</b> <br>พี่เป็นพี่รหัสเอ็งไงเมอซี่ ถามแปลกๆ 555</div>
            </div>
        </div>

        <!-- กล่อง QA ช่องที่ 2 (ใหม่) -->
        <div class="qa-box">
            <div class="question">
                <span>❓</span>
                <div><b>Q:</b> <br>พี่ชอบโทรหาเกอร์หรอคะ</div>
            </div>
            <div class="answer">
                <span>💡</span>
                <div><b>A:</b> <br>ชื่อพ่อพี่เอง เฮ้ยไม่ใช่ พี่ชอบกินเบอร์เกอร์ 555</div>
            </div>
        </div>

        <!-- กล่อง QA ช่องที่ 3 (ใหม่) -->
        <div class="qa-box">
            <div class="question">
                <span>❓</span>
                <div><b>Q:</b> <br>เวฟ</div>
            </div>
            <div class="answer">
                <span>💡</span>
                <div><b>A:</b> <br>ใช่ไหมมมน้าาาาาาา????</div>
            </div>
        </div>

        <!-- ปุ่มกดเพื่อข้ามไปหน้าคำใบ้ถัดไป -->
        <button class="btn-next" onclick="location.href='hint.html'">
            ไปดูคำใบ้ต่อเลยน้องรัก ➡️
        </button>
    </div>

</body>
</html>
