<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ส่งคำตอบให้พี่รหัส 📮</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
            background: linear-gradient(135deg, #ffcbf2 0%, #e3f2fd 100%);
        }
        .container {
            text-align: center; background: white; padding: 40px; border-radius: 25px;
            box-shadow: 0 10px 30px rgba(255, 182, 193, 0.4); max-width: 90%; width: 500px;
            border: 4px dashed #ffb3c6;
        }
        h1 { color: #ff758f; font-size: 2rem; margin-bottom: 10px; }
        p { color: #6c757d; font-size: 1.1rem; margin-bottom: 25px; }
        textarea {
            width: 100%; height: 120px; padding: 15px; border: 2px solid #ffe5ec;
            border-radius: 12px; background: #fff5f6; font-size: 1rem; color: #590d22;
            resize: none; outline: none; margin-bottom: 20px;
        }
        textarea:focus { border-color: #ff758f; }
        button {
            background-color: #ff758f; color: white; border: none; padding: 12px 40px;
            font-size: 1.2rem; font-weight: bold; border-radius: 10px; cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 117, 143, 0.4); transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }
    </style>
</head>
<body>

    <div class="container">
        <h1>📮 อยากรู้อะไรถามมา ตอบได้จาาาตอบบบบบ?</h1>
        <p>ไหนๆ..อยากบอกอะไรพี่ พิมพ์มาเลย! <br></p>

        <form action="https://formspree.io/f/maqgvqbk" method="POST">
            <textarea name="message" placeholder="พิมพ์ข้อความตรงนี้เลยน้องรัก..." required></textarea>
            <br>
            <button type="submit">ส่งคำตอบให้พี่รหัส 🚀</button>
        </form>
    </div>

</body>
</html>
