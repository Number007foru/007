<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบค้นหาพี่รหัสสุดเกรียน v4</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #74ebe5 0%, #34a0a4 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 40px 60px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 90%;
            width: 550px;
            transition: all 0.3s ease;
        }

        h1 {
            color: #1a535c;
            margin-bottom: 15px;
            font-size: 2.3rem;
            min-height: 70px;
        }

        p {
            color: #4a5568;
            font-size: 1.2rem;
            margin-bottom: 30px;
            min-height: 50px;
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            min-height: 220px; /* เพิ่มพื้นที่รองรับปุ่มขยายร่าง */
        }

        button {
            padding: 12px 30px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        #btn-yes {
            background-color: #4cc9f0;
            color: white;
            box-shadow: 0 5px 15px rgba(76, 201, 240, 0.4);
        }

        #btn-yes:hover {
            background-color: #4361ee;
        }

        #btn-no {
            background-color: #f72585;
            color: white;
            box-shadow: 0 5px 15px rgba(247, 37, 133, 0.4);
        }

        #btn-no:hover {
            background-color: #b5179e;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 id="main-title">ยินดีต้อนรับน้องเมอซี่ผู้โชคดีของพี่! 🎉</h1>
        <p id="main-text">โทษทีพี่เพิ่งตื่นพร้อมจะดูคำใบ้หรือยังจ๊ะน้องรัก?</p>
        
        <div class="btn-group">
            <button id="btn-yes" onclick="handleYesClick()">ใช่</button>
            <button id="btn-no" onclick="handleNoClick()">ไม่ใช่</button>
        </div>
    </div>

    <script>
        // ตัวแปรควบคุมขนาดของปุ่มฝั่งซ้าย (ปุ่มตกลง)
        let currentScale = 1;
        let currentPaddingX = 30;
        let currentPaddingY = 12;
        let currentFontSize = 1.1;

        // ตัวแปรเช็คสเต็ปปัจจุบัน (0คือน้าแรก, 1-5 คือด่านถามย้ำ)
        let currentStep = 0; 

        // ข้อมูลคำถามย้ำ 5 ครั้ง
        const stepsData = [
            {
                title: "เดี๋ยวก่อน! 🤔 ",
                text: "แน่ใจนะว่าพร้อมจริงๆ? ไม่ใช่ว่ามือลั่นไปโดนใช่ไหม?",
                yesText: "แน่ใจสิ กดมาขนาดนี้แล้ว",
                noText: "เออจริง... ขอคิดอีกที"
            },
            {
                title: "ถามจริง? 🤨 ",
                text: "พี่รหัสคนนี้มันติดกวนตีนนะ เตือนไว้ก่อนเลย พร้อมจะเจอหรือยัง?",
                yesText: "ไม่กลัวอยู่แล้ว ลุย!",
                noText: "หึย.. กลัวเลย ขอตั้งหลักแป๊บ"
            },
            {
                title: "ช้าก่อนออเจ้า! ✋ ",
                text: "ถ้าเปิดไปแล้วหาพี่ไม่เจอ พี่ทาแป้งเมอซี่เละน้าาา ยอมรับไหม?",
                yesText: "ยอมรับ! น้อมรับชะตากรรม",
                noText: "งั้นไม่เสี่ยงดีกว่า บายย"
            },
            {
                title: "โอกาสสุดท้าย! 🚨 ",
                text: "คิดว่าจะหาพี่เจอจริงๆอ่อ 555?",
                yesText: "ก็มาดิค้าบบบ",
                noText: "โอเค ไม่อย่าเจอละ"
            },
            {
                title: "ด่านสุดท้ายจริงๆ! 💀 ",
                text: "สาบานต่อหน้าหน้าจอเดี๋ยวนี้ว่าจะไม่โกรธพี่รหัส!?",
                yesText: "สาบาน!!! เปิดมาเถอะ!!",
                noText: "ไม่สาบาน โกรธแน่ๆ"
            }
        ];

        // ข้อความกวนๆ บนปุ่มปฏิเสธที่จะเปลี่ยนไปเรื่อยๆ เวลาโดนกดแกล้ง
        const trollTexts = ["คิดดีๆ นะ", "แน่ใจอ๋อ?", "ยอมจำนนซะ", "กดปุ่มซ้ายเถอะ", "หนีไม่พ้นหรอก", "ปุ่มจะล้นจอแล้ว!"];

        // ฟังก์ชันเมื่อกดปุ่มขวา (ปฏิเสธ/ไม่ใช่) -> สั่งขยายปุ่มซ้ายทันที ไม่ว่าจะอยู่หน้าไหน
        function handleNoClick() {
            const yesBtn = document.getElementById('btn-yes');
            const noBtn = document.getElementById('btn-no');
            
            // ขยายขนาดปุ่มฝั่งซ้าย (ใช่/ตกลง)
            currentScale += 0.3; 
            currentPaddingX += 15;
            currentPaddingY += 6;
            currentFontSize += 0.15;

            yesBtn.style.transform = `scale(${currentScale})`;
            yesBtn.style.padding = `${currentPaddingY}px ${currentPaddingX}px`;
            yesBtn.style.fontSize = `${currentFontSize}rem`;
            
            // สุ่มเปลี่ยนข้อความปุ่มขวาเพิ่มความกวน
            const randomIndex = Math.floor(Math.random() * trollTexts.length);
            noBtn.innerText = trollTexts[randomIndex];
        }

        // ฟังก์ชันเมื่อยอมกดปุ่มซ้าย (ใช่/ตกลง) -> เพื่อไปสเต็ปถัดไป
        function handleYesClick() {
            const title = document.getElementById('main-title');
            const text = document.getElementById('main-text');
            const yesBtn = document.getElementById('btn-yes');
            const noBtn = document.getElementById('btn-no');

            // รีเซ็ตขนาดปุ่มซ้ายกลับมาเป็นปกติก่อน เพื่อให้แสดงผลสวยงามในด่านถัดไป
            currentScale = 1;
            currentPaddingX = 30;
            currentPaddingY = 12;
            currentFontSize = 1.1;
            yesBtn.style.transform = "scale(1)";
            yesBtn.style.padding = "12px 30px";
            yesBtn.style.fontSize = "1.1rem";

            if (currentStep < stepsData.length) {
                // ดึงข้อมูลด่านถัดไปมาแสดง
                const currentData = stepsData[currentStep];
                
                title.innerText = currentData.title;
                text.innerText = currentData.text;
                yesBtn.innerText = currentData.yesText;
                noBtn.innerText = currentData.noText;
                
                currentStep++; 
            } else {
                
                window.location.href = 'hint.html';
            }
        }

        // ฟังก์ชันรีเซ็ตระบบเมื่อจบเกม
        function resetToStart() {
            currentStep = 0;
            currentScale = 1;
            currentPaddingX = 30;
            currentPaddingY = 12;
            currentFontSize = 1.1;

            document.getElementById('main-title').innerText = "ยินดีต้อนรับสู่น้องเมอซี่ผู้โชคดีของพี่! 🎉";
            document.getElementById('main-text').innerText = "โทษทีพี่เพิ่งตื่นพร้อมจะดูคำใบ้หรือยังจ๊ะน้องรัก?";
            
            const yesBtn = document.getElementById('btn-yes');
            yesBtn.innerText = "ใช่";
            yesBtn.style.transform = "scale(1)";
            yesBtn.style.padding = "12px 30px";
            yesBtn.style.fontSize = "1.1rem";

            const noBtn = document.getElementById('btn-no');
            noBtn.innerText = "ไม่ใช่";
        }
    </script>

</body>
</html>
